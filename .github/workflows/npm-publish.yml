name: Publish npm package

on:
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to publish
                required: true
                default: v3.0.0
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Publish @rentnerkev/select
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Validate release tag
              id: release
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
              run: |
                  set -euo pipefail

                  if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo "::error title=Invalid release tag::Release tag must match vMAJOR.MINOR.PATCH: $RELEASE_TAG"
                    exit 1
                  fi

                  echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
                  echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

            - name: Checkout release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.release.outputs.tag }}
                  fetch-depth: 1
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2

            - name: Set up Node.js and npm registry
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install Playwright Chromium
              run: bunx playwright install --with-deps chromium

            - name: Verify package name
              shell: bash
              run: |
                  set -euo pipefail

                  PACKAGE_NAME="$(node -p "require('./package.json').name")"

                  if [[ "$PACKAGE_NAME" != "@rentnerkev/select" ]]; then
                    echo "::error title=Invalid package name::Expected @rentnerkev/select, received '$PACKAGE_NAME'"
                    exit 1
                  fi

            - name: Set package version from release tag
              env:
                  PACKAGE_VERSION: ${{ steps.release.outputs.version }}
              run: npm version "$PACKAGE_VERSION" --allow-same-version --no-git-tag-version --ignore-scripts

            - name: Verify package
              run: bun run verify

            - name: Inspect npm package
              run: npm pack --dry-run --ignore-scripts

            - name: Publish to npm with trusted publishing
              run: npm publish --access public
