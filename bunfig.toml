[install]
minimumReleaseAge = 86400
# Coordinated, verified releases of our own packages can be adopted immediately.
minimumReleaseAgeExcludes = ["@rentnerkev/select", "@rentnerkev/tooltips"]
linker = "isolated"
globalStore = false
[test]
root = "src/tests"
pathIgnorePatterns = ["**/*.db.test.ts", "**/*.spec.ts", "**/types/**"]
preload = ["./src/tests/setup.ts"]
